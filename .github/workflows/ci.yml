name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the older run pointless: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: node version
        run: node --version
      - name: test suite
        run: make test
      - name: launcher parses
        run: bash -n bin/herdr-phone
